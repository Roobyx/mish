[workspace]
resolver = "2"
members = ["crates/mish-core", "crates/mish-cli", "crates/mish-ipc"]

[workspace.package]
version = "1.18.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Roobyx/mish"
rust-version = "1.99"

[workspace.dependencies]
mish-core = { path = "crates/mish-core" }
mish-ipc = { path = "crates/mish-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
