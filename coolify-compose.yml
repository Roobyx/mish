# Coolify deployment of the mish stack.
#
# Coolify's built-in proxy is not used. The app and site publish host ports and
# an external reverse proxy routes:
#   mish.cats-on-a.quest     -> 0.0.0.0:3300 (site)
#   mish.cats-on-a.quest/app -> 100.100.245.252:9543 (app, built with MISH_WEB_BASE=/app/)
#
# Images are tagged for GHCR so a build can be pushed with `docker compose push`
# and matches the release workflow.

services:
  mish:
    # Docker's cap_add only fills the bounding set, so a non-root user gets no
    # effective capabilities. Run as root with the read-search and DAC-override
    # caps so the core and Bun can read hosts whose /mnt is not world-readable
    # and write their own mish-owned data directory.
    user: "0:0"
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.server
      args:
        MISH_WEB_BASE: /app/
    image: ghcr.io/roobyx/mish/server:${MISH_TAG:-latest}
    ports:
      - "${MISH_PUBLISH_ADDR:-127.0.0.1}:${MISH_PORT:-9543}:9543"
    environment:
      MISH_DATA_DIR: /data
      MISH_BIND: 0.0.0.0:9543
      MISH_CORE_SOCKET: /run/mish/mish.sock
      MISH_ROOTS: ${MISH_ROOTS:-/host}
      MISH_HOST_ROOT: /host
      MISH_DOCKER: ${MISH_DOCKER:-true}
      MISH_AUTH_TOKEN: ${MISH_AUTH_TOKEN:-}
      MISH_ALLOWED_HOSTS: ${MISH_ALLOWED_HOSTS:-mish.cats-on-a.quest,app.cats-on-a.quest,localhost,127.0.0.1}
      MISH_TRUST_PROXY: ${MISH_TRUST_PROXY:-true}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      - mish-data:/data
      - ${HOST_MOUNT:-/}:/host:ro
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    depends_on:
      - docker-socket-proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9543/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      IMAGES: 1
      VOLUMES: 1
      EVENTS: 0
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  mish-site:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.site
    image: ghcr.io/roobyx/mish/site:${MISH_TAG:-latest}
    ports:
      - "${MISH_SITE_PORT:-3300}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mish-data:
