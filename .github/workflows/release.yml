# Publishes the mish images to GHCR on a version tag or a manual dispatch.
#
# Coolify deploys by pulling these images instead of building them. The server
# image is published twice because MISH_WEB_BASE is compiled into the web
# bundle: the default build serves at the origin root, and the `-path` build
# serves under `/app/` for the stack behind Coolify's reverse proxy.
#
# arm64 is intentionally absent: the server Dockerfile runs the Rust test suite,
# which is impractically slow under QEMU. Add a native arm runner entry to the
# matrix if that platform is needed.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  # Must stay lowercase; GHCR rejects uppercase repository paths.
  IMAGE_BASE: ghcr.io/roobyx/mish

jobs:
  publish:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: server
            image: server
            suffix: ""
            build-args: MISH_WEB_BASE=/
          - label: server-path
            image: server
            suffix: -path
            build-args: MISH_WEB_BASE=/app/
          - label: site
            image: site
            suffix: ""
            build-args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Read and verify version
        id: version
        run: |
          version=$(jq -r .version package.json)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.image }}
          flavor: |
            suffix=${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.image }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}${{ matrix.suffix }}

  # The Unraid template pins the image tag, so a release has to move it or CA
  # installs stay on the version they were first added with.
  sync-unraid:
    name: Sync Unraid template
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Point the template at the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          main_version=$(jq -r .version package.json)
          if [[ "$main_version" != "$version" ]]; then
            echo "main is at $main_version and this release is $version; leaving the template alone"
            exit 0
          fi
          xml=deploy/stores/unraid/mish.xml
          sed -i -E "s#(<Repository>ghcr\.io/roobyx/mish/server:)[^<]+(</Repository>)#\1${version}\2#" "$xml"
          if git diff --quiet -- "$xml"; then
            echo "template already points at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$xml"
          git commit -m "Point the Unraid template at ${version}"
          git push origin main
